spring.application.name=portfolio-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=postgres
app.upload.dir=uploads
spring.datasource.password=8474
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


spring.web.resources.static-locations=file:${app.upload.dir}/
